# ==============================================================================
# InsightBolivia — Great Expectations Configuration (GX 1.x)
# ==============================================================================
# Configuración del Data Context de Great Expectations para validación de calidad
# de datos del pipeline ETL de Comercio Exterior.
# ==============================================================================

config_version: 4.0

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: expectations/

  validation_results_store:
    class_name: ValidationResultsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/validations/

  checkpoint_store:
    class_name: CheckpointStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      suppress_store_backend_id: true
      base_directory: checkpoints/

  validation_definition_store:
    class_name: ValidationDefinitionStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: validation_definitions/

expectations_store_name: expectations_store
validation_results_store_name: validation_results_store
checkpoint_store_name: checkpoint_store

data_docs_sites:
  local_site:
    class_name: SiteBuilder
    show_how_to_buttons: true
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/data_docs/local_site/
    site_index_builder:
      class_name: DefaultSiteIndexBuilder
fluent_datasources:
  pandas_runtime:
    type: pandas
    id: a7032ab5-daf3-4cee-849d-bf6f740bb25b
    assets:
      df_asset:
        type: dataframe
        id: b6146734-8844-4b16-acfd-740c3231b223
        batch_metadata: {}
        batch_definitions:
          batch_def:
            id: 435d6565-de9e-4fe6-a76f-a9ba5bd4ea57
            partitioner:
plugins_directory:
config_variables_file_path:
analytics_enabled:
data_context_id: 76d293fd-6bf1-445e-bd28-d35b84716c50
