[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight-bolivia"
version = "0.1.0"
description = "Plataforma centralizada de ingeniería de datos y analítica para datos abiertos de Bolivia. Extracción, transformación, almacenamiento y visualización automática de datos de comercio exterior del INE."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Paolo Roman" },
]
keywords = ["bolivia", "datos-abiertos", "comercio-exterior", "etl", "bigquery", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # --- ETL & Data Processing ---
    "pandas>=2.2",
    "polars>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "python-calamine>=0.3",
    "dbfread>=2.0",
    "charset-normalizer>=3.3",
    # --- Configuration & Validation ---
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # --- Cloud Services ---
    "google-cloud-bigquery>=3.25",
    "google-cloud-firestore>=2.16",
    "firebase-admin>=6.5",
    # --- Data Quality ---
    "great-expectations>=1.0",
    # --- Visualization ---
    "streamlit>=1.37",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
    "papermill>=2.7.0",
    "nbformat>=5.11.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[project.urls]
Repository = "https://github.com/insightbolivia/insight-bolivia"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]


# ==============================================================================
# Ruff Configuration
# ==============================================================================
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks/output"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "S101",  # Allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"notebooks/**/*.ipynb" = ["E402"]  # sys.path manipulation before local imports

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ==============================================================================
# Pytest Configuration
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--no-header",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]

# ==============================================================================
# Coverage Configuration
# ==============================================================================
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "streamlit_app/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

# ==============================================================================
# Pyright Configuration
# ==============================================================================
[tool.pyright]
include = ["src", "tests", "streamlit_app", "notebooks"]
extraPaths = ["."]

